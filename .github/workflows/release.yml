name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: macos-latest
            bundle-path: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundle-path: src-tauri/target/release/bundle/msi/*.msi

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (pinned 2026-09-03)

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Set version from tag
        shell: bash
        run: |
          RAW=${GITHUB_REF_NAME#v}
          # Convert date-based tag (e.g. 2026.9.7.4) to semver (0.20260907.4)
          IFS='.' read -ra PARTS <<< "$RAW"
          if [ ${#PARTS[@]} -ge 4 ]; then
            SEMVER="0.${PARTS[0]}$(printf '%02d' ${PARTS[1]})$(printf '%02d' ${PARTS[2]}).${PARTS[3]}"
          elif [ ${#PARTS[@]} -eq 3 ]; then
            SEMVER="0.${PARTS[0]}$(printf '%02d' ${PARTS[1]})$(printf '%02d' ${PARTS[2]}).0"
          else
            SEMVER="$RAW"
          fi
          echo "Converting tag '$RAW' to semver '$SEMVER'"
          npm version "$SEMVER" --no-git-tag-version || echo "Version already set to $SEMVER"
          sed -i.bak "s/^version = .*/version = \"$SEMVER\"/" src-tauri/Cargo.toml
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));c.version='$SEMVER';fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(c,null,2)+'\n')"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@51a9f1156b33df106d827c3a78f8f894946c5faa # v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts for release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}
          path: |
            ${{ matrix.bundle-path }}
          if-no-files-found: warn

  create-release:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.1.1
        with:
          path: artifacts
          pattern: release-*

      - name: List artifacts
        run: ls -R artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.3.0
        with:
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
